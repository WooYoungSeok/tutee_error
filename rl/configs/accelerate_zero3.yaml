# deepspeed_config_file is resolved from the working directory: launch from rl/ (scripts/run_train.sh does).
compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_config_file: configs/ds_zero3.json
  zero3_init_flag: true
machine_rank: 0
main_training_function: main
num_machines: 1
num_processes: 3
use_cpu: false
